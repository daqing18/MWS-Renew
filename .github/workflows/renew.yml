name: MWS Renew

on:
  schedule:
    # UTC 01:00 = Asia/Shanghai 09:00, Monday/Wednesday/Friday.
    - cron: '0 1 * * 1,3,5'
  workflow_dispatch:
    inputs:
      NEW_TOKEN:
        description: Optional new MWS JWT; when set it is used only for this run
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run renewal
        env:
          # New name first; the old MWS-Renew secrets remain compatible.
          MWS_TOKEN: ${{ inputs.NEW_TOKEN || secrets.MWS_TOKEN || secrets.SESSION_TOKEN_1 || secrets.SESSION_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MWS_SECRET_NAME: MWS_TOKEN
          # Prefer notify-gateway when configured; otherwise notify.py falls
          # back to the legacy Telegram secrets already present in this repo.
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TZ: Asia/Shanghai
        run: python3 renew.py

      - name: Prune old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --repo "${{ github.repository }}" \
            --workflow="${{ github.workflow }}" \
            --limit=100 \
            --json databaseId \
            --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              gh run delete $run_id --repo "${{ github.repository }}" || true
            fi
          done
