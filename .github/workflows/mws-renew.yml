# ============================================================
# 模板名称：MWS Auto Renew（增强版）
# 描述：定时或手动调用 MWS API 续期 Bot。
#       支持手动传入新 Token 自动更新 GitHub Secrets。
#       通过 GH_TOKEN 自动更新 SESSION_TOKEN 到 Secrets。
# ============================================================

name: MWS Auto Renew

on:
  schedule:
    # UTC 时间，北京时间 = UTC + 8
    - cron: '0 10 */3 * *'
  workflow_dispatch:
    inputs:
      NEW_TOKEN:
        description: '新的 SESSION_TOKEN（从浏览器 __Host-mrtcloud_token cookie 复制）'
        required: false
        type: string

jobs:
  Renew:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      # 注意：GitHub Actions 的 permissions 不支持 secrets 键。
      # Secrets 更新通过 GH_TOKEN（PAT）完成，PAT 有 repo 权限即可。

    # ---------- 可配置变量（集中管理） ----------
    env:
      PYTHON_VERSION: '3.12'
      SCRIPT_PATH: mws_renew.py
      # ---- 账号1（必填） ----
      SESSION_TOKEN_1: ${{ secrets.SESSION_TOKEN_1 || secrets.SESSION_TOKEN }}
      BOT_IDS_1: ${{ vars.BOT_IDS_1 || vars.BOT_IDS || '9447' }}
      # ---- 账号2（可选，不需要就删掉） ----
      SESSION_TOKEN_2: ${{ secrets.SESSION_TOKEN_2 }}
      BOT_IDS_2: ${{ vars.BOT_IDS_2 || '9467' }}
      # ---- 账号3+（按需添加，格式同上） ----
      # -----------------------------------------

    steps:
      # 1. 检出当前仓库
      - name: 📥 检出当前仓库
        uses: actions/checkout@v6

      # 2. 设置 Python 环境
      - name: ⚙ 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 3. 安装 Python 依赖
      - name: 🛠️ 安装依赖
        run: |
          pip install requests

      # 4. 运行续期脚本
      - name: 🚀 运行续期脚本
        env:
          SESSION_TOKEN_1: ${{ secrets.SESSION_TOKEN_1 || secrets.SESSION_TOKEN }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          SESSION_TOKEN_2: ${{ secrets.SESSION_TOKEN_2 }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NEW_TOKEN: ${{ inputs.NEW_TOKEN || '' }}
        run: |
          python3 ${{ env.SCRIPT_PATH }}

      # 5. 清理旧的工作流运行记录（保留最近一次）
      - name: 🧹 清理旧的运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --repo "${{ github.repository }}" \
                --workflow="${{ github.workflow }}" \
                --limit=100 \
                --json databaseId \
                --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id --repo "${{ github.repository }}" || true
            fi
          done
